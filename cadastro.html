<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">ClimaTema</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="cidades.html">Cidades</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="climas.html">Climas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="cadastro.html">Cadastro</a>
        </li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar"/>
        <button class="btn btn-outline-success" type="submit">Pesquisar</button>
      </form>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <h1 class="text-center mb-4">Cadastre-se</h1>

      <div id="mensagemSucesso" class="alert alert-success d-none" role="alert">
        Cadastrado com sucesso!
      </div>

      <form onsubmit="event.preventDefault(); document.getElementById('mensagemSucesso').classList.remove('d-none'); this.reset()">
        <div class="mb-3">
          <label for="nomeCompleto" class="form-label">Nome completo</label>
          <input type="text" class="form-control" id="nomeCompleto" name="nome" autocomplete="name" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
        </div>

        <div class="mb-4">
          <label for="cidadeInteresse" class="form-label">Cidade de interesse</label>
          <select class="form-select" id="cidadeInteresse" name="cidade" required>
            <option value="" selected disabled>Escolha uma cidade</option>
            <option value="Americana">Americana</option>
            <option value="Campinas">Campinas</option>
            <option value="Piracicaba">Piracicaba</option>
            <option value="Santa Bárbara d'Oeste">Santa Bárbara d'Oeste</option>
            <option value="Nova Odessa">Nova Odessa</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
      </form>
    </div>
  </div>
</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
></script>
</body>
</html>
