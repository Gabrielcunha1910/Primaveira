<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
    >
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">ClimaTema</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="cidades.html">Cidades</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="climas.html">Climas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="cadastro.html">Cadastro</a>
        </li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Pesquisar"/>
        <button class="btn btn-outline-success" type="submit">Pesquisar</button>
      </form>
    </div>
  </div>
</nav>

<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <h1 class="text-center mb-2">Cadastre-se</h1>
      <p class="text-center text-muted mb-4">Preencha seus dados pessoais e escolha quais informações deseja receber.</p>

      <div id="mensagemSucesso" class="alert alert-success d-none" role="alert">
        Cadastro concluído para demonstração. Este site ainda não salva nem envia os dados.
      </div>

      <form onsubmit="event.preventDefault(); document.getElementById('mensagemSucesso').classList.remove('d-none'); this.reset()">
        <fieldset class="border rounded p-3 p-md-4 mb-4">
          <legend class="float-none w-auto px-2 fs-5">Seus dados</legend>
          <div class="row g-3">
            <div class="col-12 col-md-6">
              <label for="nomeCompleto" class="form-label">Nome completo</label>
              <input type="text" class="form-control" id="nomeCompleto" name="nome" autocomplete="name" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" class="form-control" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="col-12 col-md-6">
              <label for="telefone" class="form-label">Telefone</label>
              <input type="tel" class="form-control" id="telefone" name="telefone" autocomplete="tel" inputmode="tel" placeholder="(00) 00000-0000">
            </div>
            <div class="col-12 col-md-6">
              <label for="dataNascimento" class="form-label">Data de nascimento</label>
              <input type="date" class="form-control" id="dataNascimento" name="dataNascimento" autocomplete="bday">
            </div>
            <div class="col-12">
              <label for="cidadeInteresse" class="form-label">Cidade de interesse</label>
              <select class="form-select" id="cidadeInteresse" name="cidade" required>
                <option value="" selected disabled>Escolha uma cidade</option>
                <option value="Americana">Americana</option>
                <option value="Campinas">Campinas</option>
                <option value="Piracicaba">Piracicaba</option>
                <option value="Santa Bárbara d'Oeste">Santa Bárbara d'Oeste</option>
                <option value="Nova Odessa">Nova Odessa</option>
              </select>
            </div>
          </div>
        </fieldset>

        <fieldset class="border rounded p-3 p-md-4 mb-4">
          <legend class="float-none w-auto px-2 fs-5">O que você quer receber?</legend>
          <p class="text-muted">Escolha todos os assuntos que interessam.</p>
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="interessePrevisao" name="interesses" value="previsao">
                <label class="form-check-label" for="interessePrevisao">Previsão do tempo</label>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="interesseChuva" name="interesses" value="chuva">
                <label class="form-check-label" for="interesseChuva">Alertas de chuva forte</label>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="interesseTemperatura" name="interesses" value="temperatura">
                <label class="form-check-label" for="interesseTemperatura">Mudanças de temperatura</label>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="interesseCidades" name="interesses" value="cidades">
                <label class="form-check-label" for="interesseCidades">Novidades e passeios na cidade</label>
              </div>
            </div>
          </div>
        </fieldset>

        <button type="submit" class="btn btn-primary w-100">Concluir cadastro</button>
      </form>
    </div>
  </div>
</main>

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
></script>
</body>
</html>
